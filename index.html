<script type="module">
import { ImageSegmenter, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs";

  { n: "Original", s: null },

  { n: "Soft Black", s: ["#1d1a1f"], st: "solid" },

  { n: "Neon Pink", s: ["#ff2d95"], st: "solid" },
  { n: "Cherry Cola", s: ["#2b0612", "#8e1538"], st: "ombre" },
  { n: "Honey Blonde", s: ["#6b4423", "#d9a441", "#f0cf85"], st: "ombre" },
  { n: "Copper", s: ["#a8441f", "#e38a4d"], st: "ombre" },
  { n: "Sunset", s: ["#ff3d2e", "#ff9a3c", "#ffd166"], st: "ombre" },
  { n: "Cotton Candy", s: ["#ff9ed8", "#9ad7ff"], st: "ombre" },
  { n: "Mermaid", s: ["#00c2a8", "#3a7bd5", "#8e44ad"], st: "ombre" },
  { n: "Violet Haze", s: ["#2a0a5e", "#9b4dff"], st: "ombre" },
  { n: "Cyber Blue", s: ["#0066ff", "#00f0ff"], st: "ombre" },
  { n: "Emerald", s: ["#169b62"], st: "solid" },
  { n: "Galaxy", s: ["#12063a", "#5b2bd6", "#19d3ff"], st: "ombre" },
  { n: "Rainbow", s: ["#ff3b30", "#ff9f0a", "#ffd60a", "#30d158", "#0a84ff", "#bf5af2"], st: "ombre" },

  { n: "Snow White", s: ["#f5f7fb"], st: "solid" },
  { n: "Custom", s: ["#a259ff"], st: "solid", custom: true }
];
const hex = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mix = (c, t, a) => "#" + hex(c).map(v => Math.round(v + (t - v) * a).toString(16).padStart(2, "0")).join("");
const lum = c => { const [r, g, b] = hex(c); return (.2126 * r + .7152 * g + .0722 * b) / 255 };
const stopsOf = l => l.s.length > 1 ? l.s : [mix(l.s[0], 0, .4), l.s[0], mix(l.s[0], 255, .3)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let bb = { x0: 0, y0: 0, x1: 1, y1: 1, ok: false };

  if (!W || !H) return;
  const r = stage.getBoundingClientRect();
  if (!r.width || !r.height) return;

  const k = Math.min(r.width / W, r.height / H);
  frame.style.width = Math.round(W * k) + "px";
  frame.style.height = Math.round(H * k) + "px";

addEventListener("resize", fit);

/* ---------- dye engine (Solid & Ombré) ---------- */
function makeFill(c, st, b) {
  const n = st.length;

  const g = c.createLinearGradient(0, b.y0, 0, b.y1 + 1);
  st.forEach((col, i) => g.addColorStop(i / (n - 1), col));

  if (hair.length !== W * H) return;

  let x = 0, y = 0;

      const t = Math.min(1, (c - 0.25) * 2.5);
      a = (t * t * (3 - 2 * t) * 255) | 0;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    d[p] = a;
    if (++x >= W) { x = 0; y++; }
  }

  const k = smooth && bb.ok ? .3 : 1, e = bb.ok;
  bb = { x0: e ? bb.x0 + (x0 - bb.x0) * k : x0, x1: e ? bb.x1 + (x1 - bb.x1) * k : x1,
         y0: e ? bb.y0 + (y0 - bb.y0) * k : y0, y1: e ? bb.y1 + (y1 - bb.y1) * k : y1, ok: true };
  mx.putImageData(maskImg, 0, 0);

  const st = stopsOf(look);
  lx.globalCompositeOperation = "source-over";
  lx.clearRect(0, 0, W, H);
  lx.fillStyle = makeFill(lx, st, bb);
  lx.fillRect(0, 0, W, H);
  lx.globalCompositeOperation = "destination-in";
  lx.drawImage(maskC, 0, 0);

  wx.drawImage(srcC, 0, 0);

  wx.drawImage(layC, 0, 0);
  wx.globalCompositeOperation = "soft-light"; wx.globalAlpha = vib * .7;
  wx.drawImage(layC, 0, 0);
  if (lift > 0) { wx.globalCompositeOperation = "screen"; wx.globalAlpha = vib * lift; wx.drawImage(layC, 0, 0); }
  if (dark > 0) { wx.globalCompositeOperation = "multiply"; wx.globalAlpha = vib * dark; wx.drawImage(layC, 0, 0); }
  wx.globalCompositeOperation = "source-over"; wx.globalAlpha = 1; wx.filter = "none";
  dyed = true;
}

function draw(c, im) {
  c.save();
  if (mirror) { c.translate(W, 0); c.scale(-1, 1); }
  c.drawImage(im, 0, 0);
  c.restore();
}
function present(c = cx, cmp = compare) {
  if (!W) return;
  c.clearRect(0, 0, W, H);
  draw(c, dyed && look.s ? workC : srcC);
  if (cmp) { c.save(); c.beginPath(); c.rect(0, 0, split * W, H); c.clip(); draw(c, srcC); c.restore(); }
}
function repaint() {
  if (mode === "photo") { if (look.s && hairImg) dye(hairImg, false); else dyed = false; present(); }
}

/* ---------- camera lifecycle & loop cancellation fix ---------- */
function stopCam() {
  if (animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  isInferring = false;
}
async function setSeg(m) { if (segMode !== m) { await seg.setOptions({ runningMode: m }); segMode = m; } }

function ui() {
  const cam = mode === "camera", photo = mode === "photo";
  document.body.classList.toggle("ready", !!mode);
  $("welcome").hidden = !!mode;
  $("flipBtn").hidden = !cam;
  $("backBtn").hidden = !photo;
  $("saveBtn").hidden = !photo;
  $("cmpBtn").hidden = !mode;
  $("shutterBtn").hidden = !cam;
  $("hint").textContent = photo ? "Try other shades, drag the slider to compare, then tap the download icon to save."
    : "Choose a shade and tap the shutter button to capture";
  fit();
}

async function startCam() {
  if (!seg || busy) return;
  busy = true;
  try {
    stopCam();
    // Request clean, native camera feed without forced aspect ratio distortion
    const constraints = {
      video: {
        facingMode: { ideal: facing }
      },
      audio: false
    };

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
    await setSeg("VIDEO");
    mode = "camera"; mirror = facing === "user"; hairImg = null; dyed = false; lastT = -1; lastSegTime = 0; isInferring = false;
    compare = false; $("cmp").classList.remove("on"); $("cmpBtn").classList.remove("on");
    ui();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    toast("We couldn't open the camera. Please allow camera access, or upload a photo instead.");
  }
  busy = false;
}

function loop() {
  if (mode !== "camera" || !stream) {
    animId = null;
    return;
  }
  animId = requestAnimationFrame(loop);
  if (video.readyState < 2 || video.currentTime === lastT || !video.videoWidth) return;
  lastT = video.currentTime;

  const sc = Math.min(1, CAM_MAX / Math.max(video.videoWidth, video.videoHeight));
  setSize(Math.round(video.videoWidth * sc), Math.round(video.videoHeight * sc));
  sx.drawImage(video, 0, 0, W, H);

  // Asynchronous inference throttling for smooth 60fps rendering without lag
  if (look.s && seg && !isInferring) {
    isInferring = true;
    const now = performance.now();
    const ts = Math.max(lastSegTime + 1, now);
    lastSegTime = ts;
    try {
      seg.segmentForVideo(srcC, ts, r => {
        try {
          const m = r.confidenceMasks && r.confidenceMasks[1];
          if (m) {
            const a = m.getAsFloat32Array();
            if (!prev || prev.length !== a.length) prev = new Float32Array(a);
            else for (let i = 0; i < a.length; i++) prev[i] += (a[i] - prev[i]) * .4;
            dye(prev, true);
          }
        } finally {
          isInferring = false;
        }
      });
    } catch (err) {
      isInferring = false;
      console.warn("segmentForVideo warning:", err);
    }
  }

  present();
}

document.addEventListener("visibilitychange", () => {
  if (mode !== "camera") return;
  if (document.hidden) stopCam(); else startCam();
});

/* ---------- photo mode (captured or uploaded) ---------- */
async function analyse() {
  await setSeg("IMAGE");
  hairImg = null;
  seg.segment(srcC, r => {
    const m = r.confidenceMasks && r.confidenceMasks[1];
    if (m) hairImg = new Float32Array(m.getAsFloat32Array());
  });
  let hairCount = 0;
  if (hairImg) {
    for (let i = 0; i < hairImg.length; i++) {
      if (hairImg[i] > 0.25) hairCount++;
    }
  }
  if (hairCount < 50) toast("We couldn't detect hair clearly. Try a clearer photo with good lighting.");
}

async function capture() {
  if (mode !== "camera" || !W || busy) return;
  busy = true;
  flash(); stopCam(); mode = "photo";
  await analyse();
  compare = false; $("cmp").classList.remove("on"); $("cmpBtn").classList.remove("on");
  ui(); repaint();
  busy = false;
}

async function loadFile(f) {
  if (!f || !f.type.startsWith("image/") || !seg) return;
  toast("Analyzing photo…");
  const url = URL.createObjectURL(f), img = new Image();
  img.src = url;
  try {
    await img.decode();
    stopCam(); mode = "photo"; mirror = false; dyed = false;
    const sc = Math.min(1, IMG_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    W = 0; setSize(Math.round(img.naturalWidth * sc), Math.round(img.naturalHeight * sc));
    sx.drawImage(img, 0, 0, W, H);
    await analyse();
    compare = false; $("cmp").classList.remove("on"); $("cmpBtn").classList.remove("on");
    ui(); repaint();
  } catch (err) {
    console.error(err);
    toast("We couldn't read that image. Please try a JPG or PNG.");
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function save() {
  if (mode !== "photo" || !W) return;
  const [c, x] = mk(); c.width = W; c.height = H;
  present(x, false);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const fileName = "lustra-" + Date.now() + ".png";
  const file = new File([blob], fileName, { type: "image/png" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Lustra Hair Color Studio" });
      toast("Photo shared!");
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }

  // Cross-browser download fallback
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
  toast("Your photo has been saved.");
}

/* ---------- UI & comparison slider ---------- */
let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3200); }
function flash() { const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function setCompare(v) { compare = v; $("cmp").classList.toggle("on", v); $("cmpBtn").classList.toggle("on", v); fit(); if (mode === "photo") present(); }
function setSplit(f) {
  split = clamp(f, .02, .98);
  frame.style.setProperty("--x", (split * 100).toFixed(1) + "%");
  $("cmp").setAttribute("aria-valuenow", Math.round(split * 100));
  if (mode === "photo") present();
}

function syncHash() {
  if (!look) return;
  const slug = look.n.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const params = new URLSearchParams();
  params.set("shade", slug);
  if (style) params.set("style", style);
  params.set("vib", Math.round(vib * 100));
  if (look.custom && look.s) params.set("color", look.s[0]);
  history.replaceState(null, "", "#" + params.toString());
}

const car = $("car"), items = [];
const colorInput = $("customColorInput");

LOOKS.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "it" + (l.s ? "" : " none") + (l.custom ? " custom-it" : "");
  if (l.custom) {
    b.innerHTML = '<span class="custom-plus">+</span>';
  } else if (l.s) {
    b.style.background = l.s.length > 1 ? `linear-gradient(160deg,${l.s.join(",")})` : l.s[0];
  }
  b.setAttribute("aria-label", l.n);
  b.onclick = () => {
    if (l.custom && look === l) {
      colorInput.click();
      return;
    }
    pick(i);
    center(i, true);
    if (l.custom) colorInput.click();
  };
  car.appendChild(b); items.push(b);
});

colorInput.addEventListener("input", e => {
  const customLook = LOOKS.find(l => l.custom);
  if (customLook) {
    customLook.s = [e.target.value];
    if (look === customLook) {
      repaint();
      syncHash();
    }
  }
});

const center = (i, smooth) => car.scrollTo({ left: items[i].offsetLeft + items[i].offsetWidth / 2 - car.clientWidth / 2, behavior: smooth ? "smooth" : "auto" });
function pick(i) {
  look = LOOKS[i];
  if (look.s && look.st) style = look.st;
  items.forEach((b, k) => b.classList.toggle("on", k === i));
  $("name").textContent = look.custom ? "Custom Shade" : look.n;
  renderChips(); repaint(); syncHash();
}

car.addEventListener("scroll", () => {
  const step = items[1].offsetLeft - items[0].offsetLeft;
  const c = car.scrollLeft + car.clientWidth / 2 - (items[0].offsetLeft + items[0].offsetWidth / 2);
  const i = clamp(Math.round(c / step), 0, items.length - 1);
  if (LOOKS[i] !== look) pick(i);
}, { passive: true });

car.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { car.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
addEventListener("keydown", e => {
  const i = LOOKS.indexOf(look);
  if (e.key === "ArrowRight" && i < LOOKS.length - 1) center(i + 1, true);
  if (e.key === "ArrowLeft" && i > 0) center(i - 1, true);
  if (e.key === " " && mode === "camera") { e.preventDefault(); capture(); }
});

function renderChips() {
  const box = $("chips"); box.innerHTML = ""; box.style.visibility = look.s ? "visible" : "hidden";
  Object.entries(STYLES).forEach(([k, n]) => {
    const b = document.createElement("button");
    b.className = "chip" + (k === style ? " on" : ""); b.textContent = n;
    b.onclick = () => { style = k; renderChips(); repaint(); syncHash(); };
    box.appendChild(b);
  });
}
$("vib").oninput = e => { vib = e.target.value / 100; repaint(); syncHash(); };

$("camBtn").onclick = startCam;
$("backBtn").onclick = startCam;
$("saveBtn").onclick = save;
$("flipBtn").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("cmpBtn").onclick = () => setCompare(!compare);
$("shutterBtn").onclick = capture;

const file = $("file");
$("upBtn").onclick = $("upBtn2").onclick = () => file.click();
file.onchange = () => { loadFile(file.files[0]); file.value = ""; };

// Drag and drop with visual overlay
const dragOverlay = $("dragOverlay");
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; dragOverlay.classList.add("on"); });
addEventListener("dragover", e => { e.preventDefault(); });
addEventListener("dragleave", e => { e.preventDefault(); dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dragOverlay.classList.remove("on"); } });
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; dragOverlay.classList.remove("on");
  if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

// Comparison slider with robust pointer capture & keyboard support
const cmp = $("cmp");
let activePointer = null;
const moveCmp = e => {
  const r = frame.getBoundingClientRect();
  if (r.width > 0) setSplit((e.clientX - r.left) / r.width);
};
const endCmp = e => {
  if (activePointer === e.pointerId) {
    try { cmp.releasePointerCapture(e.pointerId); } catch {}
    cmp.removeEventListener("pointermove", moveCmp);
    cmp.removeEventListener("pointerup", endCmp);
    cmp.removeEventListener("pointercancel", endCmp);
    activePointer = null;
  }
};
cmp.addEventListener("pointerdown", e => {
  activePointer = e.pointerId;
  try { cmp.setPointerCapture(e.pointerId); } catch {}
  moveCmp(e);
  cmp.addEventListener("pointermove", moveCmp);
  cmp.addEventListener("pointerup", endCmp);
  cmp.addEventListener("pointercancel", endCmp);
});
cmp.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { setSplit(split - 0.05); e.preventDefault(); }
  if (e.key === "ArrowRight") { setSplit(split + 0.05); e.preventDefault(); }
});

if (FEEDBACK_URL) { $("fbLink").href = FEEDBACK_URL; $("fb").hidden = false; }

// Hash parameter restore
try {
  if (location.hash) {
    const params = new URLSearchParams(location.hash.slice(1));
    const shadeParam = params.get("shade");
    const styleParam = params.get("style");
    const vibParam = params.get("vib");
    const colorParam = params.get("color");
    if (shadeParam) {
      const idx = LOOKS.findIndex(l => l.n.toLowerCase().replace(/[^a-z0-9]+/g, "-") === shadeParam);
      if (idx !== -1) {
        look = LOOKS[idx];
        if (look.custom && colorParam) look.s = [colorParam];
      }
    }
    if (styleParam && STYLES[styleParam]) style = styleParam;
    if (vibParam) {
      const v = parseInt(vibParam, 10);
      if (!isNaN(v) && v >= 20 && v <= 100) { vib = v / 100; $("vib").value = v; }
    }
  }
} catch {}

const initialIndex = LOOKS.indexOf(look) !== -1 ? LOOKS.indexOf(look) : START;
pick(initialIndex); ui(); requestAnimationFrame(() => center(initialIndex, false));

/* ---------- PWA Service Worker Registration ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW register:", e));
  });
}

/* ---------- model ---------- */
let vision;
const create = async delegate => ImageSegmenter.createFromOptions(await vision, {
  baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: "VIDEO",
  outputCategoryMask: false, outputConfidenceMasks: true });
(async () => {
  try {
    vision = FilesetResolver.forVisionTasks(WASM);
    try { seg = await create("GPU"); } catch (e) { console.warn("GPU unavailable, using CPU", e); seg = await create("CPU"); }
    $("ld").hidden = true; $("camBtn").disabled = $("upBtn").disabled = false;
    try {
      const p = await navigator.permissions.query({ name: "camera" });
      if (p.state === "granted") startCam();
    } catch {}
  } catch (e) {
    console.error(e); $("ld").style.color = "#f66"; $("ld").textContent = "We couldn't load the model. Please check your connection and reload.";
  }
})();
</script>
</body>
</html>
