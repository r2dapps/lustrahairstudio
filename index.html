<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:description" content="Try any hair color live on your camera. Free, private, and runs entirely in your browser." />

<link rel="icon" id="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3d81'/%3E%3Cstop offset='.5' stop-color='%2319d3ff'/%3E%3Cstop offset='1' stop-color='%23a259ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='url(%23g)' stroke-width='14'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" id="touchIcon" href="" />

<style>
  :root{--sz:64px}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  .stage{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1b1b22,#000 70%)}
  .frame{position:relative;flex:none;width:0;height:0;--x:50%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
    padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));
    background:linear-gradient(#000a,transparent);pointer-events:none}
  .top>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:20px}
  .logo{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 0deg,#ff3d81,#ffb347,#4cd964,#19d3ff,#a259ff,#ff3d81);
    -webkit-mask:radial-gradient(circle,transparent 36%,#000 38%);mask:radial-gradient(circle,transparent 36%,#000 38%)}
  .tools{display:flex;gap:10px}
  .ib{width:42px;height:42px;border-radius:50%;background:#0008;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:grid;place-items:center;border:1px solid #fff2;transition:.15s}
  .ib:hover{background:#fff2}.ib.on{background:#fff;color:#000}
  .ib.pri{background:#fff;color:#000}
  .ib svg{width:20px;height:20px}

  .cmp{position:absolute;inset:0;display:none;touch-action:none;cursor:ew-resize;z-index:5}
  .cmp.on{display:block}
  .line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px #0008}
  .knob{position:absolute;top:50%;left:var(--x);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;color:#000;
    display:grid;place-items:center;box-shadow:0 2px 14px #0008}
  .knob svg{width:22px;height:22px}
  .tag{position:absolute;top:72px;padding:5px 12px;border-radius:99px;background:#000a;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .tag.l{left:12px}.tag.r{right:12px}

  .welcome{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    text-align:center;padding:24px 24px 230px}
  .welcome h2{font-size:clamp(34px,8vw,56px);font-weight:900;letter-spacing:-.03em;
    background:linear-gradient(90deg,#ff3d81,#ffb347,#19d3ff,#a259ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .welcome p{color:#fffb;max-width:32ch;line-height:1.5}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{padding:14px 26px;border-radius:99px;background:#fff;color:#000;font-weight:700;display:flex;gap:10px;align-items:center;transition:.15s}
  .btn.g{background:#fff2;color:#fff;border:1px solid #fff3}
  .btn:hover{transform:scale(1.04)}.btn:disabled{opacity:.4;pointer-events:none}
  .btn svg{width:18px;height:18px}
  .ld{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#19d3ff}
  .fine{font-size:12px;color:#fff7}
  .fine a{color:#fffb}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:36px 0 max(10px,env(safe-area-inset-bottom));
    background:linear-gradient(transparent,#000c 45%);display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .3s}
  body:not(.ready) .dock{opacity:.35;pointer-events:none}
  .name{font-weight:700;font-size:15px;letter-spacing:.04em;height:20px}
  .chips{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:0 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
  .chip{padding:7px 14px;border-radius:99px;background:#fff1;border:1px solid #fff2;font-size:13px;font-weight:600;white-space:nowrap}
  .chip.on{background:#fff;color:#000}
  .vib{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fffb;width:min(320px,80%)}
  input[type=range]{flex:1;accent-color:#fff;height:24px}
  .car{position:relative;width:100%;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    padding:12px calc(50% - var(--sz)/2) 14px}
  .it{flex:none;width:var(--sz);height:var(--sz);border-radius:50%;scroll-snap-align:center;border:3px solid #fff6;
    transition:transform .2s,border-color .2s;display:grid;place-items:center;transform:scale(.8)}
  .it.on{transform:scale(1.2);border:4px solid #fff;box-shadow:0 0 0 3px #0006,0 0 22px #fff5}
  .it.none{background:#222}
  .it.none::after{content:"";width:60%;height:3px;background:#f55;transform:rotate(45deg);border-radius:2px}
  .hint{font-size:11px;color:#fff9;margin-top:-6px;padding:0 16px;text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(240px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#000e;border:1px solid #fff3;
    padding:10px 18px;border-radius:16px;font-size:13px;opacity:0;transition:.3s;z-index:30;pointer-events:none;width:max-content;max-width:90%;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
  .flash.on{animation:fl .35s}
  @keyframes fl{from{opacity:.85}to{opacity:0}}
  @media(max-height:560px){:root{--sz:46px}.dock{gap:4px;padding-top:20px}.hint,.vib{display:none}.toast{bottom:150px}.welcome{padding-bottom:110px}}
  @media(min-width:900px){:root{--sz:72px}}
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv"></canvas>
      <div class="cmp" id="cmp"><div class="line"></div><div class="knob"><svg viewBox="0 0 24 24"><path d="m9 7-5 5 5 5M15 7l5 5-5 5"/></svg></div>
        <span class="tag l">Before</span><span class="tag r">After</span></div>
    </div>
    <div class="welcome" id="welcome">
      <h2>Lustra</h2>
      <p>Try on any hair color, live on your camera or on a photo. Everything stays on your device.</p>
      <div class="row">
        <button class="btn" id="camBtn" disabled><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>Start camera</button>
        <button class="btn g" id="upBtn" disabled><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Upload a photo</button>
      </div>
      <div class="ld" id="ld">Loading the hair model…</div>
      <div class="fine" id="fb" hidden>Enjoying Lustra? <a id="fbLink" target="_blank" rel="noopener">Send us feedback</a></div>
    </div>
  </div>

  <div class="top">
    <div class="brand"><span class="logo"></span>Lustra</div>
    <div class="tools">
      <button class="ib" id="backBtn" title="Back to camera" aria-label="Back to camera" hidden><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button class="ib" id="flipBtn" title="Switch camera" aria-label="Switch camera" hidden><svg viewBox="0 0 24 24"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5M9 22l3-3-3-3M15 2l-3 3 3 3"/></svg></button>
      <button class="ib" id="upBtn2" title="Upload a photo" aria-label="Upload a photo"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></button>
      <button class="ib" id="cmpBtn" title="Before and after" aria-label="Before and after" hidden><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg></button>
      <button class="ib pri" id="saveBtn" title="Save photo" aria-label="Save photo" hidden><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
    </div>
  </div>

  <div class="dock">
    <div class="name" id="name"></div>
    <div class="chips" id="chips"></div>
    <label class="vib">Intensity<input type="range" id="vib" min="20" max="100" value="85" aria-label="Color intensity" /></label>
    <div class="car" id="car"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<video id="video" playsinline muted style="display:none"></video>
<input type="file" id="file" accept="image/*" hidden />
<div class="toast" id="toast" role="status"></div><div class="flash" id="flash"></div>

<script type="module">
import { ImageSegmenter, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const FEEDBACK_URL = "";   // Paste a Google Form or mailto: link here to show a feedback link on the start screen.
const coarse = matchMedia("(pointer:coarse)").matches;        // phones and tablets
const CAM_MAX = coarse ? 640 : 960, IMG_MAX = 1600;
const $ = id => document.getElementById(id);

/* ---------- favicon (same ring as the logo) ---------- */
function icon(size, bg) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"), m = size / 2;
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, size, size); }
  const g = x.createConicGradient ? x.createConicGradient(-Math.PI / 2, m, m) : x.createLinearGradient(0, 0, size, size);
  ["#ff3d81", "#ffb347", "#4cd964", "#19d3ff", "#a259ff", "#ff3d81"].forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
  x.strokeStyle = g; x.lineWidth = size * .22; x.beginPath(); x.arc(m, m, size * .38, 0, Math.PI * 2); x.stroke();
  return c.toDataURL("image/png");
}
$("icon").href = icon(64); $("icon").type = "image/png";
$("touchIcon").href = icon(180, "#000");

/* ---------- looks ---------- */
const STYLES = { solid: "Solid", ombre: "Ombré", streaks: "Highlights", split: "Two-tone" };
const LOOKS = [
  { n: "Original", s: null },
  { n: "Jet Black", s: ["#0a0a0c"], st: "solid" },
  { n: "Soft Black", s: ["#1d1a1f"], st: "solid" },
  { n: "Dark Brown", s: ["#3b2416"], st: "solid" },
  { n: "Rose Gold", s: ["#c9808b"], st: "ombre" },
  { n: "Neon Pink", s: ["#ff2d95"], st: "solid" },
  { n: "Cherry Cola", s: ["#2b0612", "#8e1538"], st: "ombre" },
  { n: "Honey Blonde", s: ["#6b4423", "#d9a441", "#f0cf85"], st: "ombre" },
  { n: "Copper", s: ["#a8441f", "#e38a4d"], st: "ombre" },
  { n: "Sunset", s: ["#ff3d2e", "#ff9a3c", "#ffd166"], st: "ombre" },
  { n: "Cotton Candy", s: ["#ff9ed8", "#9ad7ff"], st: "split" },
  { n: "Mermaid", s: ["#00c2a8", "#3a7bd5", "#8e44ad"], st: "streaks" },
  { n: "Violet Haze", s: ["#2a0a5e", "#9b4dff"], st: "ombre" },
  { n: "Cyber Blue", s: ["#0066ff", "#00f0ff"], st: "ombre" },
  { n: "Emerald", s: ["#169b62"], st: "solid" },
  { n: "Galaxy", s: ["#12063a", "#5b2bd6", "#19d3ff"], st: "ombre" },
  { n: "Rainbow", s: ["#ff3b30", "#ff9f0a", "#ffd60a", "#30d158", "#0a84ff", "#bf5af2"], st: "streaks" },
  { n: "Platinum", s: ["#d5dae4"], st: "solid" },
  { n: "Silver", s: ["#b9c0cc"], st: "solid" },
  { n: "Snow White", s: ["#f5f7fb"], st: "solid" },
];
const hex = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mix = (c, t, a) => "#" + hex(c).map(v => Math.round(v + (t - v) * a).toString(16).padStart(2, "0")).join("");
const lum = c => { const [r, g, b] = hex(c); return (.2126 * r + .7152 * g + .0722 * b) / 255 };
const stopsOf = l => l.s.length > 1 ? l.s : [mix(l.s[0], 0, .4), l.s[0], mix(l.s[0], 255, .3)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- state ---------- */
let seg = null, segMode = "VIDEO", mode = null, facing = "user", mirror = true, stream = null, busy = false;
const START = LOOKS.findIndex(l => l.n === "Rose Gold");
let look = LOOKS[START], style = look.st, vib = .85, compare = false, split = .5;
let W = 0, H = 0, dyed = false, hairImg = null, prev = null, lastT = -1;
let bb = { x0: 0, y0: 0, x1: 1, y1: 1, ok: false };

const cv = $("cv"), cx = cv.getContext("2d"), video = $("video"), frame = $("frame"), stage = $("stage");
const mk = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d")] };
const [srcC, sx] = mk(), [maskC, mx] = mk(), [layC, lx] = mk(), [workC, wx] = mk();
let maskImg = null;

function setSize(w, h) {
  if (w === W && h === H) return;
  W = w; H = h;
  [cv, srcC, maskC, layC, workC].forEach(c => { c.width = w; c.height = h });
  maskImg = mx.createImageData(w, h);
  maskImg.data.fill(255);
  prev = null; bb.ok = false; fit();
}
function fit() {                     // camera fills the screen like Snapchat; photos and comparisons are shown in full
  if (!W) return;
  const r = stage.getBoundingClientRect();
  const k = (mode === "camera" && !compare) ? Math.max(r.width / W, r.height / H) : Math.min(r.width / W, r.height / H);
  frame.style.width = W * k + "px"; frame.style.height = H * k + "px";
}
addEventListener("resize", fit);

/* ---------- dye engine ---------- */
function makeFill(c, st, b) {
  const n = st.length;
  if (style === "solid") return st[n >> 1];
  if (style === "ombre") {
    const g = c.createLinearGradient(0, b.y0, 0, b.y1 + 1);
    st.forEach((col, i) => g.addColorStop(i / (n - 1), col));
    return g;
  }
  const g = c.createLinearGradient(b.x0, 0, b.x1 + 1, 0);
  if (style === "split") {
    g.addColorStop(0, st[0]); g.addColorStop(.499, st[0]); g.addColorStop(.501, st[n - 1]); g.addColorStop(1, st[n - 1]);
  } else {
    const B = 18;
    for (let k = 0; k < B; k++) { const col = st[k % n]; g.addColorStop(k / B, col); g.addColorStop((k + 1) / B - .001, col); }
  }
  return g;
}

function dye(hair, smooth) {
  if (hair.length !== W * H) return;
  const d = maskImg.data;
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let i = 0, p = 3; i < hair.length; i++, p += 4) {
    const c = hair[i];
    let a = 0;
    if (c > .25) { const t = Math.min(1, (c - .25) / .4); a = t * t * (3 - 2 * t) * 255; }
    d[p] = a;
    if (c > .5) {
      const y = (i / W) | 0, x = i - y * W;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 <= x0 || y1 <= y0) { dyed = false; return; }
  const k = smooth && bb.ok ? .3 : 1, e = bb.ok;
  bb = { x0: e ? bb.x0 + (x0 - bb.x0) * k : x0, x1: e ? bb.x1 + (x1 - bb.x1) * k : x1,
         y0: e ? bb.y0 + (y0 - bb.y0) * k : y0, y1: e ? bb.y1 + (y1 - bb.y1) * k : y1, ok: true };
  mx.putImageData(maskImg, 0, 0);

  const st = stopsOf(look);
  lx.globalCompositeOperation = "source-over";
  lx.clearRect(0, 0, W, H);
  lx.fillStyle = makeFill(lx, st, bb);
  lx.fillRect(0, 0, W, H);
  lx.globalCompositeOperation = "destination-in";
  lx.drawImage(maskC, 0, 0);

  const avg = st.reduce((s, c) => s + lum(c), 0) / st.length;
  const lift = clamp((avg - .3) * .9, 0, .6);   // lightens dark hair for pale shades
  const dark = clamp((.35 - avg) * 2.4, 0, .8); // darkens gray or light hair for deep shades
  wx.globalCompositeOperation = "source-over"; wx.globalAlpha = 1; wx.filter = "none";
  wx.drawImage(srcC, 0, 0);
  if (!coarse) wx.filter = "blur(1px)";
  wx.globalCompositeOperation = "color"; wx.globalAlpha = vib;            // dye hue and saturation, keeps strand shading
  wx.drawImage(layC, 0, 0);
  wx.globalCompositeOperation = "soft-light"; wx.globalAlpha = vib * .7;  // richness and depth
  wx.drawImage(layC, 0, 0);
  if (lift > 0) { wx.globalCompositeOperation = "screen"; wx.globalAlpha = vib * lift; wx.drawImage(layC, 0, 0); }
  if (dark > 0) { wx.globalCompositeOperation = "multiply"; wx.globalAlpha = vib * dark; wx.drawImage(layC, 0, 0); }
  wx.globalCompositeOperation = "source-over"; wx.globalAlpha = 1; wx.filter = "none";
  dyed = true;
}

function draw(c, im) {
  c.save();
  if (mirror) { c.translate(W, 0); c.scale(-1, 1); }
  c.drawImage(im, 0, 0);
  c.restore();
}
function present(c = cx, cmp = compare) {
  if (!W) return;
  c.clearRect(0, 0, W, H);
  draw(c, dyed && look.s ? workC : srcC);
  if (cmp) { c.save(); c.beginPath(); c.rect(0, 0, split * W, H); c.clip(); draw(c, srcC); c.restore(); }
}
function repaint() {
  if (mode === "photo") { if (look.s && hairImg) dye(hairImg, false); else dyed = false; present(); }
}

/* ---------- camera ---------- */
function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
}
async function setSeg(m) { if (segMode !== m) { await seg.setOptions({ runningMode: m }); segMode = m; } }
function ui() {
  const cam = mode === "camera", photo = mode === "photo";
  document.body.classList.toggle("ready", !!mode);
  $("welcome").hidden = !!mode;
  $("flipBtn").hidden = !cam; $("backBtn").hidden = !photo; $("saveBtn").hidden = !photo; $("cmpBtn").hidden = !mode;
  $("hint").textContent = photo ? "Try other shades, drag the slider to compare, then tap the download icon to save."
    : "Swipe to choose a shade · tap the center circle to take a photo";
  fit();
}

async function startCam() {
  if (!seg || busy) return;
  busy = true;
  try {
    stopCam();
    const portrait = innerHeight > innerWidth;
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: portrait ? 720 : 1280 }, height: { ideal: portrait ? 1280 : 720 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    await setSeg("VIDEO");
    mode = "camera"; mirror = facing === "user"; hairImg = null; dyed = false; lastT = -1;
    compare = false; $("cmp").classList.remove("on"); $("cmpBtn").classList.remove("on");
    ui(); loop();
  } catch (e) {
    console.error(e);
    toast("We couldn't open the camera. Please allow camera access, or upload a photo instead.");
  }
  busy = false;
}
function loop() {
  if (mode !== "camera") return;
  requestAnimationFrame(loop);
  if (video.readyState < 2 || video.currentTime === lastT || !video.videoWidth) return;
  lastT = video.currentTime;
  const sc = Math.min(1, CAM_MAX / Math.max(video.videoWidth, video.videoHeight));
  setSize(Math.round(video.videoWidth * sc), Math.round(video.videoHeight * sc));
  sx.drawImage(video, 0, 0, W, H);
  dyed = false;
  if (look.s) {
    seg.segmentForVideo(srcC, performance.now(), r => {
      const m = r.confidenceMasks && r.confidenceMasks[1];
      if (!m) return;
      const a = m.getAsFloat32Array();
      if (!prev || prev.length !== a.length) prev = new Float32Array(a);
      else for (let i = 0; i < a.length; i++) prev[i] += (a[i] - prev[i]) * .5;
      dye(prev, true);
    });
  }
  present();
}
document.addEventListener("visibilitychange", () => {   // release the camera when the tab is hidden
  if (mode !== "camera") return;
  if (document.hidden) stopCam(); else startCam();
});

/* ---------- photo mode (captured or uploaded) ---------- */
async function analyse() {
  await setSeg("IMAGE");
  hairImg = null;
  seg.segment(srcC, r => {
    const m = r.confidenceMasks && r.confidenceMasks[1];
    if (m) hairImg = new Float32Array(m.getAsFloat32Array());
  });
  if (!hairImg || !hairImg.some(v => v > .5)) toast("We couldn't find any hair. Try a clearer, front-facing photo.");
}
async function capture() {
  if (mode !== "camera" || !W || busy) return;
  busy = true;
  flash(); stopCam(); mode = "photo";
  await analyse();
  compare = false; $("cmp").classList.remove("on"); $("cmpBtn").classList.remove("on");
  ui(); repaint();
  busy = false;
}
async function loadFile(f) {
  if (!f || !f.type.startsWith("image/") || !seg) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.src = url;
  try { await img.decode(); } catch { toast("We couldn't read that image. Please try a JPG or PNG."); return; }
  stopCam(); mode = "photo"; mirror = false; dyed = false;
  const sc = Math.min(1, IMG_MAX / Math.max(img.naturalWidth, img.naturalHeight));
  W = 0; setSize(Math.round(img.naturalWidth * sc), Math.round(img.naturalHeight * sc));
  sx.drawImage(img, 0, 0, W, H);
  URL.revokeObjectURL(url);
  await analyse();
  setCompare(true); ui(); repaint();
}
async function save() {
  if (mode !== "photo" || !W) return;
  const [c, x] = mk(); c.width = W; c.height = H;
  present(x, false);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], "lustra-" + Date.now() + ".png", { type: "image/png" });
  if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {   // phones: opens the share sheet (Save Image)
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  toast("Your photo has been saved.");
}

/* ---------- UI ---------- */
let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3200); }
function flash() { const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function setCompare(v) { compare = v; $("cmp").classList.toggle("on", v); $("cmpBtn").classList.toggle("on", v); fit(); if (mode === "photo") present(); }
function setSplit(f) { split = clamp(f, .02, .98); frame.style.setProperty("--x", split * 100 + "%"); if (mode === "photo") present(); }

const car = $("car"), items = [];
LOOKS.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "it" + (l.s ? "" : " none");
  if (l.s) b.style.background = l.s.length > 1 ? `linear-gradient(160deg,${l.s.join(",")})` : l.s[0];
  b.setAttribute("aria-label", l.n);
  b.onclick = () => {
    if (LOOKS[i] !== look) return center(i, true);
    if (mode === "camera") capture(); else if (!mode) toast("Start the camera or upload a photo first.");
  };
  car.appendChild(b); items.push(b);
});
const center = (i, smooth) => car.scrollTo({ left: items[i].offsetLeft + items[i].offsetWidth / 2 - car.clientWidth / 2, behavior: smooth ? "smooth" : "auto" });
function pick(i) {
  look = LOOKS[i];
  if (look.s) style = look.st;
  items.forEach((b, k) => b.classList.toggle("on", k === i));
  $("name").textContent = look.n;
  renderChips(); repaint();
}
car.addEventListener("scroll", () => {
  const step = items[1].offsetLeft - items[0].offsetLeft;
  const c = car.scrollLeft + car.clientWidth / 2 - (items[0].offsetLeft + items[0].offsetWidth / 2);
  const i = clamp(Math.round(c / step), 0, items.length - 1);
  if (LOOKS[i] !== look) pick(i);
}, { passive: true });
car.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { car.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
addEventListener("keydown", e => {
  const i = LOOKS.indexOf(look);
  if (e.key === "ArrowRight" && i < LOOKS.length - 1) center(i + 1, true);
  if (e.key === "ArrowLeft" && i > 0) center(i - 1, true);
  if (e.key === " " && mode === "camera") { e.preventDefault(); capture(); }
});

function renderChips() {
  const box = $("chips"); box.innerHTML = ""; box.style.visibility = look.s ? "visible" : "hidden";
  Object.entries(STYLES).forEach(([k, n]) => {
    const b = document.createElement("button");
    b.className = "chip" + (k === style ? " on" : ""); b.textContent = n;
    b.onclick = () => { style = k; renderChips(); repaint(); };
    box.appendChild(b);
  });
}
$("vib").oninput = e => { vib = e.target.value / 100; repaint(); };

$("camBtn").onclick = startCam;
$("backBtn").onclick = startCam;
$("saveBtn").onclick = save;
$("flipBtn").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("cmpBtn").onclick = () => setCompare(!compare);
const file = $("file");
$("upBtn").onclick = $("upBtn2").onclick = () => file.click();
file.onchange = () => { loadFile(file.files[0]); file.value = ""; };
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

const cmp = $("cmp");
const move = e => { const r = frame.getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width); };
cmp.addEventListener("pointerdown", e => { cmp.setPointerCapture(e.pointerId); move(e); cmp.onpointermove = move; });
cmp.addEventListener("pointerup", () => cmp.onpointermove = null);

if (FEEDBACK_URL) { $("fbLink").href = FEEDBACK_URL; $("fb").hidden = false; }
pick(START); ui(); requestAnimationFrame(() => center(START, false));

/* ---------- model ---------- */
let vision;
const create = async delegate => ImageSegmenter.createFromOptions(await vision, {
  baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: "VIDEO",
  outputCategoryMask: false, outputConfidenceMasks: true });
(async () => {
  try {
    vision = FilesetResolver.forVisionTasks(WASM);
    try { seg = await create("GPU"); } catch (e) { console.warn("GPU unavailable, using CPU", e); seg = await create("CPU"); }
    $("ld").hidden = true; $("camBtn").disabled = $("upBtn").disabled = false;
    try {   // returning visitors who already allowed the camera go straight to it
      const p = await navigator.permissions.query({ name: "camera" });
      if (p.state === "granted") startCam();
    } catch {}
  } catch (e) {
    console.error(e); $("ld").style.color = "#f66"; $("ld").textContent = "We couldn't load the model. Please check your connection and reload.";
  }
})();
</script>
</body>
